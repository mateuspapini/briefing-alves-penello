<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Seu novo site · Alves Penello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a2a26; --ink-2:#4a4a44; --muted:#7b786f;
  --cream:#f3f0ea; --sand:#e8e3da; --card:#ffffff;
  --green:#22a352; --green-d:#17803f; --green-l:#dff3e6;
  --gold:#b89a5e; --line:#d9d3c7; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em;line-height:1.15}
button{font:inherit;cursor:pointer}
.app{min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;max-width:860px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mono{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-size:14px}
.step-count{font-size:13px;color:var(--muted)}
.bar{height:4px;background:var(--sand);max-width:860px;width:calc(100% - 48px);margin:0 auto;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .45s ease}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:36px 24px 170px}
.screen{max-width:760px;width:100%;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{color:var(--green-d);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.screen h1{font-size:clamp(30px,6vw,46px);margin-bottom:14px}
.screen h2{font-size:clamp(24px,4.6vw,34px);margin-bottom:8px}
.lead{color:var(--ink-2);font-size:17px;max-width:600px}
.hint{color:var(--muted);font-size:14px;margin-top:6px}
.opts{display:grid;gap:12px;margin-top:26px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;text-align:left;transition:.18s;position:relative;color:var(--ink)}
.opt:hover{border-color:var(--ink-2);transform:translateY(-2px)}
.opt.on{border-color:var(--green);background:var(--green-l);box-shadow:0 0 0 3px rgba(34,163,82,.15)}
.opt.on::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;display:grid;place-items:center}
.opt b{display:block;font-size:16px;margin-bottom:3px}
.opt span{font-size:14px;color:var(--ink-2)}
.opt .emo{font-family:Fraunces,Georgia,serif;font-size:28px;color:var(--gold);display:block;margin-bottom:6px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-size:15px;transition:.15s;color:var(--ink)}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.no.on{background:#b6463a;border-color:#b6463a}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;font:inherit;background:var(--card);color:var(--ink);margin-top:18px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,163,82,.15)}
/* sliders */
.sl{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:14px}
.sl .ends{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:10px}
.sl .ends small{font-weight:400;color:var(--muted);display:block;font-size:12px}
.sl .ends div:last-child{text-align:right}
input[type=range]{width:100%;accent-color:var(--green);height:28px}
/* mood boards */
.mood{padding:0;overflow:hidden}
.mood .sw{display:flex;height:92px}
.mood .sw i{flex:1}
.mood .tx{padding:14px 16px}
.mood .sample{position:absolute;left:14px;top:14px;font-family:Fraunces,Georgia,serif;font-size:22px}
/* voice */
.quote{font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.4;font-weight:500;display:block;margin-bottom:6px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--cream) 30%);padding:28px 24px 22px}
.nav .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{border:0;border-radius:999px;padding:14px 26px;font-weight:600;font-size:15px;transition:.15s}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:#000}
.btn.pri:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.wa{background:var(--green);color:#fff;display:inline-flex;align-items:center;gap:10px;font-size:16px;padding:16px 28px}
.btn.wa:hover{background:var(--green-d)}
.kbd{font-size:12px;color:var(--muted)}
@media(max-width:620px){.kbd{display:none}}
.btn{white-space:nowrap}
.mood{display:block;width:100%}
/* intro */
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:40px 36px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(184,154,94,.45)}
.hero::after{content:"";position:absolute;right:30px;top:30px;width:120px;height:120px;border-radius:50%;border:1px solid rgba(184,154,94,.3)}
.hero .kicker{color:#7fd9a0}
.hero .lead{color:#d8d5cc}
.facts{display:flex;gap:22px;margin-top:26px;flex-wrap:wrap;font-size:14px;color:#cfccc2}
.facts b{color:#fff;font-family:Fraunces,Georgia,serif;font-size:22px;display:block}
/* summary */
.sum{background:var(--card);border-radius:var(--r);border:1.5px solid var(--line);margin-top:22px}
.sum div{padding:12px 18px;border-bottom:1px solid var(--sand);font-size:14px}
.sum div:last-child{border:0}
.sum b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.done-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;align-items:center}
.credit{display:flex;justify-content:center;margin-top:12px}
.credit a{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#cfccc2;text-decoration:none;font-size:11px;letter-spacing:.04em;padding:7px 14px 7px 14px;border-radius:999px;opacity:.85;transition:.2s}
.credit a:hover{opacity:1}
.credit img{height:22px;width:auto;display:block}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

  if(i<0) return intro();
  if(i>=total) return done();
  const q=Q[i]; let h=`<div class="screen"><div class="kicker">${q.kicker}</div><h2>${q.title}</h2><p class="lead">${q.lead||""}</p>`;
  if(q.type==="text"){
    h+= q.long?`<textarea rows="4" id="t" placeholder="${esc(q.ph||"")}">${esc(A[q.id]||"")}</textarea>`
              :`<input type="text" id="t" placeholder="${esc(q.ph||"")}" value="${esc(A[q.id]||"")}">`;
  }
  if(q.type==="single"){
    h+=`<div class="opts ${q.cols}">`+q.opts.map((o,k)=>`<button class="opt ${A[q.id]===o[1]?"on":""}" data-k="${k}">${o[0]?`<span class="emo">${o[0]}</span>`:""}${q.id==="voz"?`<span class="quote">${o[1]}</span><span>${o[2]}</span>`:`<b>${o[1]}</b>${o[2]?`<span>${o[2]}</span>`:""}`}</button>`).join("")+`</div>`;
  }
  if(q.type==="multi"){
    const sel=(A[q.id]||{}).sel||[];
    h+=`<div class="chips">`+q.chips.map(c=>`<button class="chip ${q.no?"no":""} ${sel.includes(c)?"on":""}">${c}</button>`).join("")+`</div>`;
    if(q.extra) h+=`<input type="text" id="t" placeholder="${esc(q.extra)}" value="${esc((A[q.id]||{}).txt||"")}">`;
  }
  if(q.type==="sliders"){
    const v=A[q.id]||q.items.map(()=>50);
    h+=q.items.map((s,k)=>`<div class="sl"><div class="ends"><div>${s[0]}<small>${s[1]}</small></div><div>${s[2]}<small>${s[3]}</small></div></div><input type="range" min="0" max="100" value="${v[k]}" data-k="${k}"></div>`).join("");
  }
  if(q.type==="mood"){
    h+=`<div class="opts g2">`+q.opts.map((o,k)=>`<button class="opt mood ${A[q.id]===o[0]?"on":""}" data-k="${k}"><div class="sw" style="position:relative">${o[2].map(c=>`<i style="background:${c}"></i>`).join("")}<span class="sample" style="color:${o[4]};text-shadow:0 1px 8px ${o[3]}">Aa</span></div><div class="tx"><b>${o[0]}</b><span>${o[1]}</span></div></button>`).join("")+`</div>`;
  }
  h+=`</div>`; main.innerHTML=h; bind(q); validate();
}

function bind(q){
  const t=$("#t");
  if(q.type==="text"){t.addEventListener("input",()=>{A[q.id]=t.value;validate()}); setTimeout(()=>t.focus(),60)}
  if(q.type==="single"||q.type==="mood"){
    main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A[q.id]=q.opts[+b.dataset.k][q.type==="mood"?0:1];
      main.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===b));validate();setTimeout(go,380)});
  }
  if(q.type==="multi"){
    A[q.id]=A[q.id]||{sel:[],txt:""};
    main.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const s=A[q.id].sel,c=b.textContent,ix=s.indexOf(c);
      if(ix>=0)s.splice(ix,1); else{ if(s.length>=q.max){toast(`Escolha até ${q.max}`);return} s.push(c)}
      b.classList.toggle("on",ix<0);validate()});
    if(t) t.addEventListener("input",()=>{A[q.id].txt=t.value;validate()});
  }
  if(q.type==="sliders"){
    A[q.id]=A[q.id]||q.items.map(()=>50);
    main.querySelectorAll("input[type=range]").forEach(r=>r.oninput=()=>{A[q.id][+r.dataset.k]=+r.value});
  }
}

function ok(){
  const q=Q[i]; if(!q) return true; const a=A[q.id];
  if(q.optional||q.type==="sliders") return true;
  if(q.type==="text") return !!(a&&a.trim());
  if(q.type==="multi") return !!(a&&(a.sel.length||a.txt.trim()));
  return !!a;
}
function validate(){ if(i>=0&&i<Q.length){next.disabled=!ok(); next.textContent = i===Q.length-1?"Concluir ✓": (Q[i].optional&&!(A[Q[i].id]||"").trim()?"Pular →":"Continuar →")} }
function go(){ if(i>=0&&i<Q.length&&!ok())return; i++; render(); window.scrollTo({top:0,behavior:"smooth"}) }
next.onclick=go; back.onclick=()=>{i--;render()};
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&e.target.tagName!=="TEXTAREA"&&!next.disabled&&i<Q.length){e.preventDefault();go()} });

function intro(){
  next.style.display=""; next.disabled=false; next.textContent="Começar →";
  main.innerHTML=`<div class="screen"><div class="hero"><div class="kicker">Seu novo site começa aqui</div>
  <h1>Queremos que o site tenha a cara de vocês.</h1>
  <p class="lead">Algumas perguntas rápidas, quase todas de tocar e escolher. Suas respostas vão guiar cores, textos, fotos e o jeito de falar com cada cliente.</p>
  <div class="facts"><div><b>${Q.length}</b>perguntas</div><div><b>~5 min</b>para responder</div><div><b>1 toque</b>para enviar</div></div></div></div>`;
}

function fmt(q){
  const a=A[q.id];
  if(a==null) return "—";
  if(q.type==="multi") return [a.sel.join(", "),a.txt].filter(Boolean).join(" | ")||"—";
  if(q.type==="sliders") return q.items.map((s,k)=>{const v=a[k];const lado=v<40?s[0]:v>60?s[2]:"equilíbrio";return `${s[0]}↔${s[2]}: ${lado} (${v})`}).join("; ");
  return String(a).trim()||"—";
}
function label(q){return q.kicker+": "+q.title.replace(/<[^>]+>/g,"")}
function textAll(){
  return `*Briefing do site · Alves Penello*\n\n`+Q.map(q=>`*${label(q)}*\n${fmt(q)}`).join("\n\n");
}

function done(){
  next.style.display="none";
  main.innerHTML=`<div class="screen"><div class="kicker">Tudo pronto</div><h2>Obrigado${A.nome?", "+esc(A.nome.split(" ")[0]):""}! Agora é só enviar.</h2>
  <p class="lead">Toque no botão verde: o WhatsApp abre com tudo preenchido, basta mandar.</p>
  <div class="done-row"><button class="btn wa" id="wa"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>Enviar pelo WhatsApp</button>
  <button class="btn ghost" id="cp">Copiar respostas</button></div>
  <div class="sum">${Q.map(q=>`<div><b>${esc(q.kicker)}</b>${esc(fmt(q))}</div>`).join("")}</div>
  <p class="hint" style="margin-top:16px">Quer mudar algo? <a href="#" id="redo" style="color:var(--green-d)">Voltar às perguntas</a>.</p></div>`;
  $("#wa").onclick=()=>window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(textAll())}`,"_blank");
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(textAll());toast("Respostas copiadas")}catch(e){toast("Não foi possível copiar")}};
  $("#redo").onclick=e=>{e.preventDefault();i=0;render()};
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
render();
</script>
</body>
</html>
